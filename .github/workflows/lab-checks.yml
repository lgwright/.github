# Shared checks for LGW Lab repositories. A repository calls this workflow
# from its own .github/workflows/lab-checks.yml (see templates/).
name: lab-checks

on:
  workflow_call:
    inputs:
      full_scan:
        description: Check the whole history and every tracked file
        type: boolean
        default: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: lgwright/.github
          path: .lab-checks

      - name: Range
        id: range
        env:
          FULL: ${{ inputs.full_scan }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base=""
          if [ "$FULL" != "true" ]; then
            if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; fi
            if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then base="$BEFORE"; fi
          fi
          if [ -n "$base" ] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=""; fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if [ -n "$base" ]; then echo "Checking changes since $base"; else echo "Checking the whole repository"; fi

      - name: Secrets (gitleaks)
        if: always()
        env:
          BASE: ${{ steps.range.outputs.base }}
        run: |
          v=8.30.1
          curl -sSLo gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks && rm gl.tgz
          if [ -n "$BASE" ]; then
            ./gitleaks git --redact --no-banner --log-opts="$BASE..HEAD" .
          else
            ./gitleaks git --redact --no-banner .
          fi

      - name: Large files and notebook outputs
        if: always()
        env:
          BASE: ${{ steps.range.outputs.base }}
        run: python3 .lab-checks/scripts/lab_checks.py --base "$BASE" --max-mb 10

      - name: Writing (STE, advisory)
        if: always()
        continue-on-error: true
        env:
          BASE: ${{ steps.range.outputs.base }}
        run: |
          if [ -n "$BASE" ]; then
            files=$(git diff --name-only --diff-filter=AM "$BASE" HEAD -- '*.md')
          else
            files=$(git ls-files -- '*.md')
          fi
          if [ -z "$files" ]; then echo "No Markdown to check"; exit 0; fi
          echo "$files" | tr '\n' '\0' | xargs -0 python3 .lab-checks/scripts/stecheck.py --brief 10 || true
